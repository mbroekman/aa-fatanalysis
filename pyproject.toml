[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-fatanalysis"
description = "FAT Analysis Plugin for Alliance Auth"
readme = "README.md"
keywords = [
    "allianceauth",
    "fatanalysis",
]
license = { file = "LICENSE" }
authors = [
    { name = "Maddog Broekman", email = "maddogbroekman@gmail.com" },
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "django-webtest>=1.9.12",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "responses>=0.25",
    "ruff>=0.9.0",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "django-eveuniverse>=2.2.0",
    "fakeredis>=2.40.0",
]

[tool.hatch]
version.path = "fatanalysis/__init__.py"
build.include = [
    "/fatanalysis",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_files = [ "fatanalysis/__init__.py", "pyproject.toml:version" ]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "testauth",
]
lint.select = [ "E", "F", "I", "W" ]
lint.ignore = []
lint.per-file-ignores."**/migrations/*" = [ "E501" ]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
plugins = [ "mypy_django_plugin.main" ]

[tool.django-stubs]
django_settings_module = "fatanalysis.tests.test_settings"

[tool.pytest.ini_options]
python_files = [ "*_test.py", "test_*.py" ]
DJANGO_SETTINGS_MODULE = "fatanalysis.tests.test_settings"
